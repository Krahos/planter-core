[package]
name = "planter-core"
version = "0.0.5"
edition = "2024"
authors = ["Sebastiano Giordano"]
description = "Domain logic for PlanTer, a project management application"
documentation = "https://docs.rs/planter-core"
keywords = ["project_management"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/krahos/planter-core"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
phonenumber = "0.3"
regex = "1.13"
thiserror = "2"
nutype = "0.7"
email_address = "0.2"
bon = "3.9"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "nutype/serde"]

[dev-dependencies]
proptest = { version = "1.11", features = ["proptest-macro"] }
rand = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
